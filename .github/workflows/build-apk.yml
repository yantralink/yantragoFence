# Build Android APK — triggered manually or on push to main
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Verify Android platform files
        working-directory: mobile
        run: |
          if [ -d "android" ]; then
            echo ">>> Android directory exists"
          else
            echo ">>> Generating Android platform files..."
            flutter create --platforms=android --org com.yantrago --project-name yantrago .
          fi

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (non-blocking)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://yantrago.com \
            --dart-define=WS_BASE_URL=wss://yantrago.com/ws \
            --verbose 2>&1 || {
              echo "=== Build failed, printing gradle files for debug ==="
              cat android/build.gradle 2>/dev/null
              echo "---"
              cat android/settings.gradle 2>/dev/null
              echo "---"
              cat android/app/build.gradle 2>/dev/null
              exit 1
            }

      - name: List built APK
        working-directory: mobile
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "APK not found"

      - name: Rename APK with version
        working-directory: mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/yantrago-android.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: YantraGO Android APK (Build #${{ github.run_number }})
          body: |
            ## YantraGO Android App

            ### Download
            Download `yantrago-android.apk` below and install on your Android device.

            ### Login
            - **Super Admin:** superadmin@yantrago.com / password
            - **Customer:** phone number / yantrago

            ### Server
            Connects to: https://yantrago.com
          files: mobile/build/app/outputs/flutter-apk/yantrago-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yantrago-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 0
