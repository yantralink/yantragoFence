# Build Android APK — triggered manually or on push to main
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          # Create android/ platform directory if it doesn't exist
          if [ ! -d "android" ]; then
            echo ">>> Generating Android platform files..."
            flutter create --platforms=android --org com.yantrago --project-name yantrago .
          else
            echo ">>> Android directory already exists"
          fi

      - name: Update Kotlin version for compatibility
        working-directory: mobile
        run: |
          # Flutter 3.24 generates Kotlin 1.7.x but dependencies need 1.9.x
          # Print original files for debugging
          echo "=== android/build.gradle (before) ==="
          cat android/build.gradle
          echo "=== android/settings.gradle (before) ==="
          cat android/settings.gradle

          # Update ext.kotlin_version in android/build.gradle (older format)
          if grep -q 'ext.kotlin_version' android/build.gradle; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/" android/build.gradle
            echo ">>> Updated ext.kotlin_version in build.gradle"
          fi

          # Update plugins block in settings.gradle (newer format)
          # Format: id "org.jetbrains.kotlin.android" version "1.7.10" apply false
          if grep -q 'org.jetbrains.kotlin.android' android/settings.gradle; then
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
            echo ">>> Updated kotlin version in settings.gradle plugins block"
          fi

          # Also check app/build.gradle for kotlin version
          if grep -q 'kotlin_version' android/app/build.gradle 2>/dev/null; then
            sed -i "s/kotlin_version = .*/kotlin_version = '1.9.24'/" android/app/build.gradle
            echo ">>> Updated kotlin_version in app/build.gradle"
          fi

          echo "=== android/build.gradle (after) ==="
          cat android/build.gradle
          echo "=== android/settings.gradle (after) ==="
          cat android/settings.gradle

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (non-blocking)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://yantrago.com \
            --dart-define=WS_BASE_URL=wss://yantrago.com/ws \
            --verbose 2>&1 || {
              echo "=== Build failed, printing gradle files for debug ==="
              cat android/build.gradle 2>/dev/null
              echo "---"
              cat android/settings.gradle 2>/dev/null
              echo "---"
              cat android/app/build.gradle 2>/dev/null
              exit 1
            }

      - name: List built APK
        working-directory: mobile
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "APK not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yantrago-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 0
