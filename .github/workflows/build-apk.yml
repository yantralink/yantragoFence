# Build Android APK — triggered manually or on push to main
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # secrets context is unavailable in step `if:` — expose via env.
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Verify Android platform files
        working-directory: mobile
        run: |
          if [ -d "android" ]; then
            echo ">>> Android directory exists"
          else
            echo ">>> Generating Android platform files..."
            flutter create --platforms=android --org com.yantrago --project-name yantrago .
          fi

      - name: Write upload keystore from secrets
        # PLAY Task 12.3: sign sideload APKs with the same upload key as the
        # Play AAB so sideload ↔ Play installs/upgrades stay compatible.
        # Requires the same ANDROID_* secrets as build-aab.yml.
        working-directory: mobile/android
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > yantrago-upload.jks
          test -s yantrago-upload.jks || { echo "Keystore decode failed"; exit 1; }
          cat > key.properties <<EOF
          storeFile=yantrago-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (blocking)
        # SEC-12: flutter analyze failures must block release builds.
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://yantrago.com \
            --dart-define=WS_BASE_URL=wss://yantrago.com/ws \
            --verbose 2>&1 || {
              echo "=== Build failed, printing gradle files for debug ==="
              cat android/build.gradle 2>/dev/null
              echo "---"
              cat android/settings.gradle 2>/dev/null
              echo "---"
              cat android/app/build.gradle 2>/dev/null
              exit 1
            }

      - name: List built APK
        working-directory: mobile
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "APK not found"

      - name: Rename per-ABI APKs
        working-directory: mobile
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/yantrago-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/yantrago-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             build/app/outputs/flutter-apk/yantrago-android-x64.apk

      - name: Create GitHub Release with APK
        # SEC-12: Pinned to immutable commit SHA (not @v1 tag).
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: YantraGO Android APK (Build #${{ github.run_number }})
          body: |
            ## YantraGO Android App

            ### Download (choose your device architecture)
            - **yantrago-android-arm64.apk** — 64-bit ARM (most modern phones, ~20MB)
            - **yantrago-android-arm32.apk** — 32-bit ARM (older phones, ~18MB)
            - **yantrago-android-x64.apk** — x86_64 (emulators, ~20MB)

            Not sure which one? Install [Droid Hardware Info](https://play.google.com/store/apps/details?id=com.droidhardinfo) and check the "Architecture" field, or try the arm64 version first.

            ### Server
            Connects to: https://yantrago.com
          files: |
            mobile/build/app/outputs/flutter-apk/yantrago-android-arm64.apk
            mobile/build/app/outputs/flutter-apk/yantrago-android-arm32.apk
            mobile/build/app/outputs/flutter-apk/yantrago-android-x64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yantrago-android-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
          compression-level: 0

      - name: Scrub signing material
        if: always()
        run: |
          rm -f mobile/android/yantrago-upload.jks mobile/android/key.properties
