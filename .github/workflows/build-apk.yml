# Build Android APK — triggered manually or on push to main
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          # Create android/ platform directory if it doesn't exist
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.yantrago .
          fi

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://yantrago.com --dart-define=WS_BASE_URL=wss://yantrago.com/ws

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yantrago-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 0
