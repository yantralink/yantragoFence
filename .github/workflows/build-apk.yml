# Build Android APK — triggered manually or on push to main
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          # Create android/ platform directory if it doesn't exist
          if [ ! -d "android" ]; then
            echo ">>> Generating Android platform files..."
            flutter create --platforms=android --org com.yantrago --project-name yantrago .
          else
            echo ">>> Android directory already exists"
          fi

      - name: Update Kotlin version for compatibility
        working-directory: mobile
        run: |
          # Flutter 3.24 generates Kotlin 1.7.x but dependencies need 1.9.x
          # Update ext.kotlin_version in android/build.gradle
          if grep -q 'ext.kotlin_version' android/build.gradle; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi
          # Also update in android/settings.gradle if present
          if grep -q 'kotlin' android/settings.gradle; then
            sed -i "s/org.jetbrains.kotlin.android:1.*/org.jetbrains.kotlin.android:1.9.24/" android/settings.gradle 2>/dev/null || true
          fi
          echo ">>> Kotlin version updated to 1.9.24"
          grep -n 'kotlin' android/build.gradle || true
          grep -n 'kotlin' android/settings.gradle || true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (non-blocking)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://yantrago.com \
            --dart-define=WS_BASE_URL=wss://yantrago.com/ws

      - name: List built APK
        working-directory: mobile
        run: |
          ls -la build/app/outputs/flutter-apk/ || echo "APK not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yantrago-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 0
