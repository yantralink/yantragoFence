# Build Android App Bundle (AAB) for Google Play — PLAY Task 12.4.
#
# Trigger: manually (workflow_dispatch) or on version tags (v*).
#
# Required GitHub secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64 — base64 of yantrago-upload.jks
#     (create:  base64 -w0 yantrago-upload.jks > keystore.b64 )
#   ANDROID_KEYSTORE_PASSWORD      — storePassword
#   ANDROID_KEY_ALIAS              — keyAlias (e.g. yantrago-upload)
#   ANDROID_KEY_PASSWORD           — keyPassword
#
# The AAB is signed with the UPLOAD key (Task 12.1). Play App Signing
# (Task 12.2) re-signs with Google's app-signing key on upload — the
# printed SHA-256 fingerprint must match the upload-key certificate
# shown in Play Console → App integrity.
name: Build Android AAB (Play)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Write upload keystore from secrets
        working-directory: mobile/android
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_UPLOAD_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > yantrago-upload.jks
          test -s yantrago-upload.jks || { echo "Keystore decode failed"; exit 1; }
          sha256sum yantrago-upload.jks

      - name: Write key.properties from secrets
        working-directory: mobile/android
        run: |
          cat > key.properties <<EOF
          storeFile=yantrago-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (blocking)
        # SEC-12: analyzer failures must block release builds.
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        # Golden baselines are generated on Windows — they fail on the
        # Linux runner due to font rasterization differences. They still
        # run locally; CI excludes them via the 'golden' tag.
        working-directory: mobile
        run: flutter test --exclude-tags golden

      - name: Build App Bundle
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://yantrago.com \
            --dart-define=WS_BASE_URL=wss://yantrago.com/ws

      - name: Verify AAB signature
        working-directory: mobile
        run: |
          jarsigner -verify -verbose -certs \
            build/app/outputs/bundle/release/app-release.aab 2>&1 \
            | grep -E "SHA-256|jar verified" || true
          echo ">>> Compare the SHA-256 fingerprint above with"
          echo ">>> Play Console → App integrity → Upload key certificate."

      # PLAY 13.x — release-artifact verification, enforced on every AAB:
      #   13.1 target API level must be >= 36 (Play requires API 36 for new apps)
      #   13.2 every 64-bit .so must have LOAD alignment >= 16 KB
      #   13.3 merged-manifest permissions must not contain unexpected
      #        dangerous permissions
      - name: Verify target API level (PLAY 13.1)
        working-directory: mobile
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          [ -x "$APKANALYZER" ] || APKANALYZER="$(command -v apkanalyzer)"
          TARGET_SDK=$($APKANALYZER manifest target-sdk "$AAB" | tr -d '[:space:]')
          MIN_SDK=$($APKANALYZER manifest min-sdk "$AAB" | tr -d '[:space:]')
          echo "targetSdkVersion=$TARGET_SDK minSdkVersion=$MIN_SDK"
          if [ "$TARGET_SDK" -lt 36 ]; then
            echo "ERROR: targetSdk $TARGET_SDK < 36 — Play rejects new apps below API 36."
            exit 1
          fi

      - name: Verify merged-manifest permissions (PLAY 13.3)
        working-directory: mobile
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          [ -x "$APKANALYZER" ] || APKANALYZER="$(command -v apkanalyzer)"
          $APKANALYZER manifest permissions "$AAB" | tee merged-permissions.txt
          # Dangerous permissions the app must NOT gain silently via plugin
          # upgrades. Extend deliberately after a privacy review.
          BANNED="ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION \
            ACCESS_BACKGROUND_LOCATION CAMERA RECORD_AUDIO READ_CONTACTS \
            WRITE_CONTACTS READ_SMS SEND_SMS RECEIVE_SMS READ_CALL_LOG \
            WRITE_CALL_LOG READ_PHONE_STATE READ_PHONE_NUMBERS BODY_SENSORS \
            ACTIVITY_RECOGNITION BLUETOOTH_SCAN BLUETOOTH_CONNECT \
            BLUETOOTH_ADVERTISE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
            MANAGE_EXTERNAL_STORAGE QUERY_ALL_PACKAGES \
            REQUEST_INSTALL_PACKAGES READ_MEDIA_IMAGES READ_MEDIA_VIDEO \
            READ_MEDIA_AUDIO NFC"
          FAIL=0
          for perm in $BANNED; do
            if grep -q "android.permission.$perm" merged-permissions.txt; then
              echo "ERROR: unexpected dangerous permission: $perm"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Verify 16 KB page-size support (PLAY 13.2)
        working-directory: mobile
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          rm -rf aab-extract && mkdir aab-extract
          # Inside an AAB the base module's libs live at base/lib/<abi>/.
          unzip -o -q "$AAB" -d aab-extract '*/lib/*' || true
          FAIL=0
          COUNT=0
          for so in $(find aab-extract -name '*.so' 2>/dev/null); do
            abi=$(basename "$(dirname "$so")")
            case "$abi" in
              arm64-v8a|x86_64)
                COUNT=$((COUNT+1))
                while read -r align; do
                  dec=$((16#${align#0x}))
                  if [ "$dec" -lt 16384 ]; then
                    echo "FAIL: $so LOAD align=$align (< 0x4000)"
                    FAIL=1
                  fi
                done < <(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}')
                ;;
            esac
          done
          echo "Checked $COUNT 64-bit shared libraries."
          [ "$COUNT" -gt 0 ] || { echo "ERROR: no 64-bit .so found"; exit 1; }
          [ "$FAIL" -eq 0 ] && echo "All 64-bit libraries are 16 KB aligned."
          exit $FAIL

      - name: Rename AAB artifact
        working-directory: mobile
        run: |
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/yantrago-${{ github.run_number }}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: yantrago-aab-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/yantrago-${{ github.run_number }}.aab
          retention-days: 90
          compression-level: 0

      - name: Create GitHub Release with AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: ${{ github.ref_name }}
          name: YantraGO ${{ github.ref_name }}
          body: |
            ## YantraGO Android App Bundle (Play Store)

            - **yantrago-${{ github.run_number }}.aab** — signed with the upload key; upload to Play Console.

            ### Server
            Connects to: https://yantrago.com
          files: mobile/build/app/outputs/bundle/release/yantrago-${{ github.run_number }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scrub signing material
        if: always()
        run: |
          rm -f mobile/android/yantrago-upload.jks mobile/android/key.properties
