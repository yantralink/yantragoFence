# Deploy Production — deploy on release tag (v*.*.*)
name: Deploy Production

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build backend JAR
        run: ./gradlew :backend:bootJar -x test --no-daemon

      - name: Build gateway JAR
        run: ./gradlew :device-gateway:bootJar -x test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/yantrago-backend:latest
            ${{ secrets.DOCKER_REGISTRY }}/yantrago-backend:${{ steps.version.outputs.VERSION }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.gateway
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/yantrago-gateway:latest
            ${{ secrets.DOCKER_REGISTRY }}/yantrago-gateway:${{ steps.version.outputs.VERSION }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/yantrago
            docker compose -f infra/docker/docker-compose.staging.yml pull
            docker compose -f infra/docker/docker-compose.staging.yml up -d
            docker image prune -f
