# Deploy Production — build JARs in CI, upload to the production server,
# restart services. Same proven flow as deploy-staging.yml, different host.
#
# Server layout (see /opt/yantrago):
#   backend/app.jar, gateway/app.jar — systemd services
#     (yantrago-backend.service, yantrago-gateway.service)
#   config/ — application-prod.yml, push.env, etc. (managed on the server)
#
# Flyway migrations apply automatically when the backend boots.
name: Deploy Production

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build backend JAR
        run: ./gradlew :backend:bootJar -x test --no-daemon

      - name: Build gateway JAR
        run: ./gradlew :device-gateway:bootJar -x test --no-daemon

      - name: Stage JARs for upload
        run: |
          mkdir -p deploy/backend deploy/gateway
          cp backend/build/libs/backend-1.0.0.jar deploy/backend/app.jar
          cp device-gateway/build/libs/device-gateway-1.0.0.jar deploy/gateway/app.jar
          ls -la deploy/backend deploy/gateway

      - name: Inject WEATHER_API_KEY into backend env
        # SEC-12: key arrives via GitHub Actions secret (repo Settings →
        # Secrets), never committed. Runs BEFORE jar upload so a failed
        # upload can't block env config (the deployed backend already
        # ships the weather endpoint). Discovers the service's
        # EnvironmentFile on the server at deploy time; skips cleanly
        # when the secret is unset or the file is not writable.
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: WEATHER_API_KEY
          script: |
            set -e
            if [ -z "$WEATHER_API_KEY" ]; then
              echo "WEATHER_API_KEY secret not set — skipping injection"
              exit 0
            fi
            ENV_FILE=$( (systemctl cat yantrago-backend 2>/dev/null || true) | sed -n 's/^EnvironmentFile=//p' | head -1)
            if [ -z "$ENV_FILE" ]; then
              echo "::warning::No EnvironmentFile in yantrago-backend unit — set WEATHER_API_KEY manually"
              exit 0
            fi
            if grep -q "^WEATHER_API_KEY=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^WEATHER_API_KEY=.*|WEATHER_API_KEY=$WEATHER_API_KEY|" "$ENV_FILE" 2>/dev/null \
                || sudo -n sed -i "s|^WEATHER_API_KEY=.*|WEATHER_API_KEY=$WEATHER_API_KEY|" "$ENV_FILE" 2>/dev/null \
                || { echo "::warning::Cannot write $ENV_FILE — set WEATHER_API_KEY manually"; exit 0; }
            else
              (echo "WEATHER_API_KEY=$WEATHER_API_KEY" >> "$ENV_FILE") 2>/dev/null \
                || (echo "WEATHER_API_KEY=$WEATHER_API_KEY" | sudo -n tee -a "$ENV_FILE" >/dev/null) 2>/dev/null \
                || { echo "::warning::Cannot write $ENV_FILE — set WEATHER_API_KEY manually"; exit 0; }
            fi
            echo "WEATHER_API_KEY injected into $ENV_FILE"

      - name: Upload backend JAR
        # SEC-12: Pinned to immutable commit SHA (not @v0.1.7 tag).
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: deploy/backend/app.jar
          target: /opt/yantrago/backend/
          strip_components: 2

      - name: Upload gateway JAR
        # SEC-12: Pinned to immutable commit SHA (not @v0.1.7 tag).
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: deploy/gateway/app.jar
          target: /opt/yantrago/gateway/
          strip_components: 2

      - name: Restart services and verify
        # SEC-12: Pinned to immutable commit SHA (not @v1.0.3 tag).
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            systemctl restart yantrago-backend
            systemctl restart yantrago-gateway
            sleep 10
            systemctl is-active yantrago-gateway
            # Wait for the backend to come healthy (Flyway migrations run on boot)
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q UP; then
                echo "Backend healthy after ${i} checks"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Backend failed to become healthy"
                journalctl -u yantrago-backend -n 50 --no-pager
                exit 1
              fi
              sleep 5
            done
            systemctl is-active yantrago-backend yantrago-gateway
            echo "Deploy complete"
