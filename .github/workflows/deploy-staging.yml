# Deploy Staging — deploy on merge to main
#
# The staging docker-compose (infra/docker/docker-compose.staging.yml)
# builds the backend/gateway images ON THE SERVER from source (build:
# contexts), so no Docker registry is involved. CI only needs to SSH in,
# update the checkout, and let compose build and start the stack.
name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          password: ${{ secrets.STAGING_PASSWORD }}
          script: |
            set -e
            cd /opt/yantrago
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker/docker-compose.staging.yml pull
            docker compose -f infra/docker/docker-compose.staging.yml up -d --build
            docker image prune -f
