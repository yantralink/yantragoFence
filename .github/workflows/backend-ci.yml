# Backend CI — build and test all Java modules on PR
# Per AGENTS.md rule 12: production features require tests.
name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'device-gateway/**'
      - 'simulator/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
          cache-disabled: false

      - name: Build all modules
        run: ./gradlew :backend :shared :device-gateway :simulator build --no-daemon

      - name: Run backend tests
        run: ./gradlew :backend:test --no-daemon

      - name: Run gateway tests
        run: ./gradlew :device-gateway:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
