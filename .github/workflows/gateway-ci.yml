# Gateway CI — build and test device-gateway + shared on PR
name: Gateway CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'device-gateway/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/gateway-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build shared + gateway
        run: ./gradlew :shared :device-gateway build --no-daemon

      - name: Run gateway tests
        run: ./gradlew :device-gateway:test --no-daemon

      - name: Upload gateway test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-reports
          path: |
            device-gateway/build/reports/tests/
            device-gateway/build/test-results/
          retention-days: 7
