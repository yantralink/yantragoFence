<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="380" height="620" style="background:#f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Screen Frame -->
  <rect x="10" y="10" width="360" height="600" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Top Bar -->
  <text x="30" y="45" font-size="18" font-weight="bold" fill="#0f172a">‹ Machine Details</text>
  
  <!-- Machine Details Card -->
  <rect x="25" y="65" width="330" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="92" font-size="16" font-weight="bold" fill="#0f172a">Harvester X350</text>
  <text x="40" y="115" font-size="12" fill="#64748b">IMEI: <tspan fill="#334155" font-weight="500">864201938571029</tspan></text>
  <text x="40" y="133" font-size="12" fill="#64748b">Company: <tspan fill="#334155" font-weight="500">YantraTech Solutions</tspan></text>
  <text x="40" y="151" font-size="12" fill="#64748b">Owner: <tspan fill="#334155" font-weight="500">Rajesh Kumar</tspan></text>
  
  <!-- Location Tile -->
  <rect x="25" y="190" width="330" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="212" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="1">LOCATION</text>
  <text x="40" y="233" font-size="12" font-weight="500" fill="#1e293b">Plot 42, Hinjewadi Phase 3, Pune, MH 411057</text>
  <line x1="40" y1="255" x2="340" y2="255" stroke="#f1f5f9" stroke-width="1"/>
  <text x="40" y="280" font-size="12" font-weight="bold" fill="#2563eb">📍 Open in Map</text>
  <text x="325" y="280" font-size="14" font-weight="bold" fill="#2563eb">➔</text>
  
  <!-- 2x2 Telemetry Grid -->
  <!-- Voltage -->
  <rect x="25" y="315" width="158" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="37" y="335" font-size="10" font-weight="bold" fill="#94a3b8">VOLTAGE</text>
  <text x="37" y="362" font-size="18" font-weight="bold" fill="#0f172a">24.2 V</text>
  <text x="37" y="385" font-size="11" font-weight="600" fill="#16a34a">● Normal</text>

  <!-- Fault -->
  <rect x="197" y="315" width="158" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="209" y="335" font-size="10" font-weight="bold" fill="#94a3b8">FAULTS</text>
  <text x="209" y="362" font-size="18" font-weight="bold" fill="#0f172a">0 Active</text>
  <text x="209" y="385" font-size="11" font-weight="600" fill="#16a34a">● Clear</text>

  <!-- Battery -->
  <rect x="25" y="415" width="158" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="37" y="435" font-size="10" font-weight="bold" fill="#94a3b8">BATTERY</text>
  <text x="37" y="462" font-size="18" font-weight="bold" fill="#0f172a">88%</text>
  <text x="37" y="485" font-size="11" font-weight="600" fill="#16a34a">● Good</text>

  <!-- SIM Expiry -->
  <rect x="197" y="415" width="158" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="209" y="435" font-size="10" font-weight="bold" fill="#94a3b8">SIM EXPIRE</text>
  <text x="209" y="460" font-size="14" font-weight="bold" fill="#0f172a">18 Oct 2026</text>
  <text x="209" y="485" font-size="11" font-weight="600" fill="#d97706">39 Days Left</text>

  <!-- Action Buttons -->
  <rect x="25" y="520" width="158" height="50" rx="12" fill="#16a34a"/>
  <text x="104" y="550" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TURN ON</text>

  <rect x="197" y="520" width="158" height="50" rx="12" fill="#dc2626"/>
  <text x="276" y="550" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TURN OFF</text>
</svg>
