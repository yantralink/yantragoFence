# YantraGO — Nginx reverse proxy for backend API and admin web
# Place in /etc/nginx/sites-available/yantrago and symlink to sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream — backend API
upstream yantrago_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream — admin web (Next.js)
upstream yantrago_admin_web {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP — redirect to HTTPS
server {
    listen 80;
    server_name yantrago.com www.yantrago.com api.yantrago.com admin.yantrago.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Public site (privacy policy, account-deletion help)
# Deploy: copy infra/vultr/public-site/ to /var/www/yantrago-public/
# Certs:  certbot --nginx -d yantrago.com -d www.yantrago.com
#
# NOTE: the mobile app's default API_BASE_URL / WS_BASE_URL point at the
# apex (https://yantrago.com, wss://yantrago.com/ws), so this block must
# also proxy /api/ and /ws to the backend — not just serve static files.
server {
    listen 443 ssl http2;
    server_name yantrago.com www.yantrago.com;

    ssl_certificate /etc/letsencrypt/live/yantrago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yantrago.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Static page uses inline styles only — no scripts, no remote assets.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" always;

    # Request size limit
    client_max_body_size 10m;

    # API proxy — mobile app default base URL is the apex.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://yantrago_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-06: Overwrite (not append) X-Forwarded-For — see api block below.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket — mobile app default ws URL is wss://yantrago.com/ws.
    include /etc/nginx/sites-available/nginx.websocket.conf;

    # Health check (for load balancers / uptime checks on the apex).
    location /health {
        proxy_pass http://yantrago_backend/actuator/health;
        access_log off;
    }

    # Public static content (privacy policy, future public pages).
    root /var/www/yantrago-public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# HTTPS — Backend API
server {
    listen 443 ssl http2;
    server_name api.yantrago.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.yantrago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yantrago.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit
    client_max_body_size 10m;

    # API proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://yantrago_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-06: Overwrite (not append) X-Forwarded-For so clients cannot
        # spoof the header. $remote_addr is the actual TCP source IP as
        # seen by nginx; any client-supplied X-Forwarded-For is discarded.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Actuator (restricted to internal)
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://yantrago_backend;
    }

    # WebSocket (include websocket config)
    include /etc/nginx/sites-available/nginx.websocket.conf;

    # Health check
    location /health {
        proxy_pass http://yantrago_backend/actuator/health;
        access_log off;
    }
}

# HTTPS — Admin Web
server {
    listen 443 ssl http2;
    server_name admin.yantrago.com;

    ssl_certificate /etc/letsencrypt/live/admin.yantrago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yantrago.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Privacy policy must be publicly reachable without auth — serve the
    # same static page as yantrago.com/privacy-policy.
    location = /privacy-policy {
        return 301 /privacy-policy/;
    }
    location /privacy-policy/ {
        alias /var/www/yantrago-public/privacy-policy/;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://yantrago_admin_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-06: Overwrite (not append) X-Forwarded-For to prevent spoofing.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
