# YantraGO — Nginx reverse proxy for backend API and admin web
# Place in /etc/nginx/sites-available/yantrago and symlink to sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream — backend API
upstream yantrago_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream — admin web (Next.js)
upstream yantrago_admin_web {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP — redirect to HTTPS
server {
    listen 80;
    server_name api.yantrago.com admin.yantrago.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Backend API
server {
    listen 443 ssl http2;
    server_name api.yantrago.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.yantrago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yantrago.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit
    client_max_body_size 10m;

    # API proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://yantrago_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Actuator (restricted to internal)
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://yantrago_backend;
    }

    # WebSocket (include websocket config)
    include /etc/nginx/sites-available/nginx.websocket.conf;

    # Health check
    location /health {
        proxy_pass http://yantrago_backend/actuator/health;
        access_log off;
    }
}

# HTTPS — Admin Web
server {
    listen 443 ssl http2;
    server_name admin.yantrago.com;

    ssl_certificate /etc/letsencrypt/live/admin.yantrago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yantrago.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://yantrago_admin_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
