<!DOCTYPE html>
<!--
  YantraGO in-app machine map — SEC-15.

  All executable code is bundled with the app (leaflet.js 1.9.4, verified
  against the official SRI hash). No remote JavaScript is ever loaded.

  The CSP below constrains this page to:
    - scripts/styles only from its own bundled assets ('self')
    - images only from bundled assets and the OpenStreetMap tile CDN
    - no other resource types (no connect-src, no fonts, no frames)
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.tile.openstreetmap.org data:;">
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <script src="map.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
</body>
</html>
