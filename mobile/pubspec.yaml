name: yantrago
description: YantraGO — Machine management platform for fencing machines.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^12.0.0

  # HTTP
  dio: ^5.3.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Device preferences (language — non-sensitive, must survive logout)
  shared_preferences: ^2.2.0

  # WebSocket / STOMP
  stomp_dart_client: ^0.4.4

  # Internationalization
  intl: ^0.20.0

  # Maps (bundled Leaflet.js 1.9.4 via WebView — SEC-15: no remote JS)
  webview_flutter: ^4.10.0

  # Push notifications (Phase 5)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  # Asset generators — run once after editing config below:
  #   dart run flutter_launcher_icons   (PLAY Task 12.6)
  #   dart run flutter_native_splash:create   (PLAY Task 12.8)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# PLAY Task 12.6 — branded launcher icon. Sources live in tool/launcher_icons/
# (outside the bundled assets tree — 1.2MB of icon sources must not ship in
# the AAB). They are pre-padded SQUARE renders of the (wide) logo — icon
# generators distort non-square sources, so do not point these at
# assets/images/logo.png.
flutter_launcher_icons:
  android: true
  image_path: "tool/launcher_icons/app_icon.png"
  adaptive_icon_foreground: "tool/launcher_icons/app_icon_foreground.png"
  adaptive_icon_background: "#0B65C2"
  min_sdk_android: 21

# PLAY Task 12.8 — native splash (removes the white flash on cold start).
flutter_native_splash:
  color: "#0B65C2"
  image: "assets/images/logo.png"
  android_12:
    color: "#0B65C2"
    image: "assets/images/logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    # SEC-15: bundled Leaflet 1.9.4 map assets (JS/CSS/marker images) —
    # the WebView never loads executable code from the network.
    - assets/map/
