name: yantrago
description: YantraGO — Machine management platform for fencing machines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^12.0.0

  # HTTP
  dio: ^5.3.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # WebSocket / STOMP
  stomp_dart_client: ^0.4.4

  # Internationalization
  intl: ^0.18.0

  # Maps (Leaflet.js via WebView)
  webview_flutter: ^4.10.0

  # Push notifications (Phase 5)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
