name: yantrago
description: YantraGO — Machine management platform for fencing machines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^12.0.0

  # HTTP
  dio: ^5.3.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # WebSocket / STOMP
  web_socket_channel: ^2.4.0
  stomp_dart_client: ^0.4.4

  # Internationalization
  intl: ^0.18.0

  # JSON serialization
  json_annotation: ^4.8.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
