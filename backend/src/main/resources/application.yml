# YantraGO Backend API — Default Configuration
# Profile-specific overrides live in application-{profile}.yml.
# Secrets MUST come from environment variables (AGENTS.md rule 20).

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: yantrago-backend

  # Database — placeholders resolved from environment variables
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yantrago}
    username: ${DB_USERNAME:yantrago}
    password: ${DB_PASSWORD:yantrago}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway — migrations live in classpath:db/migration (copied from database/migrations)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # JPA / Hibernate — Flyway manages schema, Hibernate only maps
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: false
    open-in-view: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # SEC-17: isolated vhost — set RABBITMQ_VHOST in staging/production.
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated    # Phase 1 fix: enable publisher confirms
    publisher-returns: true               # Phase 1 fix: detect unroutable messages
    listener:
      simple:
        default-requeue-rejected: false   # rejected messages are dead-lettered (not requeued forever)

  # Mail (SMTP) — optional, defaults disabled
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# CORS — explicit origin allowlist (SEC-13).
# In production set SECURITY_CORS_ALLOWED_ORIGINS to the actual admin-web domain.
# Mobile apps do not use CORS; only browser clients need an entry here.
security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}

# JWT configuration — secrets MUST be provided via environment variables in production
jwt:
  access:
    secret: ${JWT_ACCESS_SECRET:yantrago-dev-access-secret-change-in-production-min-32-chars}
    ttl: 900                # 15 minutes (seconds)
  refresh:
    secret: ${JWT_REFRESH_SECRET:yantrago-dev-refresh-secret-change-in-production-min-32-chars}
    ttl: 2592000            # 30 days (seconds)

# Push notifications (optional — choose one provider)
push:
  provider: ${PUSH_PROVIDER:none}        # none | fcm | expo | onesignal
  fcm:
    server:
      key: ${FCM_SERVER_KEY:}
    service-account: ${FCM_SERVICE_ACCOUNT:}   # Firebase service account JSON (env var)
    project-id: ${FCM_PROJECT_ID:}              # Firebase project ID (env var)
    ttl-seconds: ${FCM_TTL_SECONDS:86400}       # 24-hour TTL for stale-event cancellation
  scheduler:
    check-interval-ms: ${PUSH_SCHEDULER_INTERVAL:15000}  # 15 seconds
    batch-size: ${PUSH_SCHEDULER_BATCH:50}
    lease-seconds: ${PUSH_SCHEDULER_LEASE:60}
  token:
    encryption-key: ${PUSH_TOKEN_ENCRYPTION_KEY:}   # AES-GCM key for token at-rest encryption
  expo:
    api:
      url: ${EXPO_API_URL:}
  onesignal:
    app:
      id: ${ONESIGNAL_APP_ID:}

# SMS (optional)
sms:
  provider: ${SMS_PROVIDER:none}         # none | twilio | msg91
  twilio:
    account:
      sid: ${TWILIO_ACCOUNT_SID:}
    auth:
      token: ${TWILIO_AUTH_TOKEN:}

# Alert detection (Phase 2)
alert:
  offline:
    enabled: ${ALERT_OFFLINE_ENABLED:true}
    grace-minutes: ${ALERT_OFFLINE_GRACE_MINUTES:15}    # reconnect grace before marking offline
    check-interval-ms: ${ALERT_OFFLINE_CHECK_MS:60000}  # 1 minute
    batch-size: ${ALERT_OFFLINE_BATCH_SIZE:100}
    lease-seconds: ${ALERT_OFFLINE_LEASE_SECONDS:30}
  expiry:
    enabled: ${ALERT_EXPIRY_ENABLED:true}
    check-interval-ms: ${ALERT_EXPIRY_CHECK_MS:300000}  # 5 minutes
    milestones-days: ${ALERT_EXPIRY_MILESTONES:7,3,1,0} # days before/after expiry
    batch-size: ${ALERT_EXPIRY_BATCH_SIZE:100}
    lease-seconds: ${ALERT_EXPIRY_LEASE_SECONDS:30}

# Automatic fence ON/OFF scheduling (docs/SCHEDULED_FENCE_ONOFF_IMPLEMENTATION.md)
schedule:
  execution:
    enabled: ${SCHEDULE_EXECUTION_ENABLED:true}          # kill switch — disables the engine without deploy
  tick-ms: ${SCHEDULE_TICK_MS:30000}                     # scheduler tick interval
  max-attempts: ${SCHEDULE_MAX_ATTEMPTS:3}               # dispatch attempts per run (gateway has no retry)
  on-catchup-minutes: ${SCHEDULE_ON_CATCHUP_MINUTES:15}  # max lateness for a missed ON (safety cap)
  retry-interval-minutes: ${SCHEDULE_RETRY_INTERVAL_MINUTES:5}    # re-dispatch spacing for failed runs
  dispatch-timeout-minutes: ${SCHEDULE_DISPATCH_TIMEOUT_MINUTES:5} # stuck DISPATCHED reconciliation
  runs-retention-days: ${SCHEDULE_RUNS_RETENTION_DAYS:90}          # schedule_runs cleanup
  cleanup-cron: ${SCHEDULE_CLEANUP_CRON:0 0 3 * * *}               # daily 03:00

# Geo-fence auto-creation (Phase 11)
# Auto-creation on first GPS is DISABLED. Customers must explicitly enable
# theft protection after installing the machine on their farm via the
# mobile app toggle. This prevents false alerts during transport from shop.
# A default DISABLED MACHINE_MOVING alert rule is auto-created when a machine
# is assigned to a customer (see MachineService.assignMachineToCustomer).

# Notification feature switches (Phase 6)
# Per notification plan N11: feature switches separately control each event family
# and push dispatch. Disabling push preserves inbox and incident processing.
notification:
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:false}         # global push kill switch (off until Phase 5 validated)
  event-families:
    enabled: ${NOTIFICATION_EVENT_FAMILIES:}            # comma-separated list (empty = all enabled)
    # e.g. "LOW_BATTERY,VOLTAGE_DROP" to enable only those; empty or "*" = all
  storm:
    max-per-minute: ${NOTIFICATION_STORM_MAX_PER_MIN:10}        # per-user push limit per minute
    max-per-type-per-hour: ${NOTIFICATION_STORM_MAX_PER_TYPE:5}  # per-user per-alert-type per hour

# Geocoding — SEC-15: machine addresses are resolved server-side so the
# mobile app never sends farmer-linked coordinates to a third party.
# Outbound provider calls are globally throttled (default ~1 req/sec, the
# Nominatim usage-policy limit) and cached. For production, point
# GEOCODING_PROVIDER_URL at an approved provider under a data-processing
# agreement (e.g. a self-hosted Nominatim instance or a commercial
# geocoder); the default is the public OSM Nominatim endpoint.
geocoding:
  enabled: ${GEOCODING_ENABLED:true}
  provider:
    base-url: ${GEOCODING_PROVIDER_URL:https://nominatim.openstreetmap.org}
  user-agent: ${GEOCODING_USER_AGENT:YantraGO-Backend/1.0}
  cache-max-entries: ${GEOCODING_CACHE_MAX_ENTRIES:500}
  min-request-interval-ms: ${GEOCODING_MIN_REQUEST_INTERVAL_MS:1100}
  max-wait-ms: ${GEOCODING_MAX_WAIT_MS:15000}
  # decimals sent to the provider — 4 ≈ 11m precision, enough for an address
  coordinate-precision: ${GEOCODING_COORDINATE_PRECISION:4}

# Privacy / erasure (PLAY-06)
# Mailbox that receives account-deletion-request notifications. Empty =
# notification disabled (requests are still recorded in audit_logs).
# The privacy policy's deletion-request contact should match this address.
privacy:
  notify-email: ${PRIVACY_NOTIFY_EMAIL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger — SEC-13: disabled by default; enabled in dev profile
# or explicitly via SWAGGER_ENABLED=true in non-production environments.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

# Logging
logging:
  level:
    root: INFO
    com.yantrago: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
