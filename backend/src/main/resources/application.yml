# YantraGO Backend API — Default Configuration
# Profile-specific overrides live in application-{profile}.yml.
# Secrets MUST come from environment variables (AGENTS.md rule 20).

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: yantrago-backend

  # Database — placeholders resolved from environment variables
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yantrago}
    username: ${DB_USERNAME:yantrago}
    password: ${DB_PASSWORD:yantrago}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway — migrations live in classpath:db/migration (copied from database/migrations)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # JPA / Hibernate — Flyway manages schema, Hibernate only maps
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: false
    open-in-view: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  # Mail (SMTP) — optional, defaults disabled
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# JWT configuration — secrets MUST be provided via environment variables in production
jwt:
  access:
    secret: ${JWT_ACCESS_SECRET:yantrago-dev-access-secret-change-in-production-min-32-chars}
    ttl: 900                # 15 minutes (seconds)
  refresh:
    secret: ${JWT_REFRESH_SECRET:yantrago-dev-refresh-secret-change-in-production-min-32-chars}
    ttl: 2592000            # 30 days (seconds)

# Push notifications (optional — choose one provider)
push:
  provider: ${PUSH_PROVIDER:none}        # none | fcm | expo | onesignal
  fcm:
    server:
      key: ${FCM_SERVER_KEY:}
  expo:
    api:
      url: ${EXPO_API_URL:}
  onesignal:
    app:
      id: ${ONESIGNAL_APP_ID:}

# SMS (optional)
sms:
  provider: ${SMS_PROVIDER:none}         # none | twilio | msg91
  twilio:
    account:
      sid: ${TWILIO_ACCOUNT_SID:}
    auth:
      token: ${TWILIO_AUTH_TOKEN:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    root: INFO
    com.yantrago: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
