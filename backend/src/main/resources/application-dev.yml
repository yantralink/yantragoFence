# YantraGO Backend API — Development Profile
# Activate with: --spring.profiles.active=dev
# Points to localhost services (Postgres, Redis, RabbitMQ running via docker-compose.dev.yml)

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/yantrago
    username: yantrago
    password: yantrago
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: localhost
      port: 6379
      password:

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false   # allow flyway clean in dev

# Dev JWT secrets — NOT for production (AGENTS.md rule 20)
jwt:
  access:
    secret: yantrago-dev-access-secret-change-in-production-min-32-chars
    ttl: 3600              # 1 hour in dev for convenience
  refresh:
    secret: yantrago-dev-refresh-secret-change-in-production-min-32-chars
    ttl: 2592000           # 30 days

# Verbose logging in dev
logging:
  level:
    root: INFO
    com.yantrago: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

# Swagger always enabled in dev
springdoc:
  swagger-ui:
    enabled: true

# Disable push/email/sms in dev by default
push:
  provider: none
sms:
  provider: none
